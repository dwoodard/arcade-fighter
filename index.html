<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101829"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><title>Arcade Fighter</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101829;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style></head><body><canvas id="game"></canvas><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let W=960,H=540,scale=1,last=0,phase='ready',timer=0,round=1,shake=0,particles=[],keys=new Set(),touch=new Map(),buttons=[];
const P={x:275,y:0,vx:0,vy:0,face:1,hp:100,color:'#26b5d5',accent:'#f4d3a5',state:'idle',attack:0,hit:0,cool:0,score:0},E={x:685,y:0,vx:0,vy:0,face:-1,hp:100,color:'#df5061',accent:'#f6c6a0',state:'idle',attack:0,hit:0,cool:0,score:0};const ground=423,gravity=.8;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);scale=Math.min(canvas.width/960,canvas.height/540);W=canvas.width/scale;H=canvas.height/scale;ctx.imageSmoothingEnabled=false;buttons=[{id:'left',x:70,y:H-75,r:35,t:'◀'},{id:'right',x:158,y:H-75,r:35,t:'▶'},{id:'jump',x:245,y:H-75,r:33,t:'▲'},{id:'block',x:W-258,y:H-75,r:34,t:'GUARD'},{id:'punch',x:W-164,y:H-100,r:37,t:'PUNCH'},{id:'kick',x:W-75,y:H-69,r:41,t:'KICK'}]}
addEventListener('resize',resize);resize();
function reset(){for(const [f,x,face] of [[P,275,1],[E,685,-1]]){f.x=x;f.y=ground;f.vx=f.vy=0;f.face=face;f.hp=100;f.state='idle';f.attack=f.hit=f.cool=0}particles=[];phase='ready';timer=75}
function down(id){return keys.has(id)||[...touch.values()].includes(id)}
function move(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width/scale,y=(e.clientY-r.top)*canvas.height/r.height/scale;return buttons.find(b=>Math.hypot(x-b.x,y-b.y)<b.r*1.3)?.id||null}
for(const eventName of ['contextmenu','selectstart','dragstart'])document.addEventListener(eventName,e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);if(phase==='over'){round++;reset();return}if(phase==='ready'){phase='fight'}const b=move(e);if(b)touch.set(e.pointerId,b)});
canvas.addEventListener('pointermove',e=>{if(touch.has(e.pointerId))touch.set(e.pointerId,move(e))});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>touch.delete(e.pointerId));
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',KeyJ:'punch',KeyK:'kick',KeyL:'block',Space:'punch'};addEventListener('keydown',e=>{const id=keymap[e.code];if(id){e.preventDefault();keys.add(id);if(phase==='ready')phase='fight';if(phase==='over'){round++;reset()}}});addEventListener('keyup',e=>{const id=keymap[e.code];if(id)keys.delete(id)});addEventListener('blur',()=>{keys.clear();touch.clear()});
function strike(a,b,type){if(a.cool>0||a.hit>0||a.attack>0)return;a.attack=type==='kick'?23:16;a.cool=type==='kick'?39:27;a.state=type;const reach=type==='kick'?115:88;if(Math.abs(a.x-b.x)<reach&&Math.abs(a.y-b.y)<52&&Math.sign(b.x-a.x)===a.face){const blocked=b===P&&down('block')||b===E&&b.state==='block';const damage=blocked?2:type==='kick'?12:8;b.hp=Math.max(0,b.hp-damage);b.hit=blocked?6:16;b.vx=a.face*(blocked?2:8);shake=blocked?3:9;for(let i=0;i<12;i++)particles.push({x:b.x-a.face*18,y:b.y-92,vx:(Math.random()-.5)*11,vy:(Math.random()-.5)*10,life:22,color:i%2?'#fff5ac':'#ff6a62'});if(b.hp===0){phase='over';a.score++}}}
function step(){if(phase!=='fight')return;timer-=1/60;if(timer<=0){phase='over';if(P.hp>E.hp)P.score++;else if(E.hp>P.hp)E.score++}for(const f of [P,E]){f.face=(f===P?E.x:P.x)>f.x?1:-1;f.cool=Math.max(0,f.cool-1);f.hit=Math.max(0,f.hit-1);f.attack=Math.max(0,f.attack-1);f.vy+=gravity;f.y+=f.vy;if(f.y>ground){f.y=ground;f.vy=0}f.x=Math.max(55,Math.min(905,f.x+f.vx));f.vx*=.75;if(f.hit)f.state='hurt';else if(f.attack){}else f.state='idle'}if(P.hit===0){const dir=(down('right')?1:0)-(down('left')?1:0);if(dir){P.x=Math.max(55,Math.min(905,P.x+dir*4.2));if(!P.attack)P.state='walk'}if(down('jump')&&P.y===ground)P.vy=-14;if(down('block')&&!P.attack)P.state='block';if(down('punch'))strike(P,E,'punch');else if(down('kick'))strike(P,E,'kick')}if(E.hit===0){const dist=P.x-E.x;if(Math.abs(dist)>95)E.x+=Math.sign(dist)*2.1;else if(Math.random()<.025)strike(E,P,Math.random()<.55?'punch':'kick');if(Math.random()<.006&&E.y===ground)E.vy=-12;if(!E.attack&&Math.abs(dist)>95)E.state='walk';else if(!E.attack&&Math.random()<.15)E.state='block'}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life--}particles=particles.filter(p=>p.life>0);shake*=.8}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function bg(){rect(0,0,W,H,'#151b35');rect(0,0,W,220,'#253c61');ctx.fillStyle='#faad6b';ctx.beginPath();ctx.arc(W*.72,125,64,0,7);ctx.fill();for(let i=0;i<15;i++){const x=i*95-50;rect(x,155,75,210,'#192b47');rect(x+14,170,18,24,'#ffcc7d');rect(x+44,170,18,24,'#ffcc7d');rect(x+14,216,18,24,'#e89962');rect(x+44,216,18,24,'#e89962')}rect(0,365,W,H-365,'#4e4556');for(let i=0;i<16;i++)rect(i*90-20,370,6,H-370,'#695668');rect(0,ground+6,W,7,'#f6bd6c');for(let i=0;i<24;i++)rect(i*54,ground+20,24,3,'#776176')}
function fighter(f,t){const bob=f.state==='walk'?Math.sin(t*.018)*5:Math.sin(t*.004)*2;ctx.save();ctx.translate(Math.round(f.x),Math.round(f.y+bob));ctx.scale(f.face,1);const punch=f.state==='punch'&&f.attack>5,kick=f.state==='kick'&&f.attack>7,block=f.state==='block';rect(-25,-110,50,59,f.hit?'#fff2d7':f.color);rect(-21,-51,18,49,'#22283e');rect(4,-51,18,49,'#22283e');rect(-25,-8,24,10,'#fafafa');rect(3,-8,24,10,'#fafafa');rect(-20,-158,42,48,f.accent);rect(-23,-163,47,17,'#1b263a');rect(9,-135,6,6,'#142036');rect(-28,-104,16,49,f.accent);rect(punch?18:block?12:18,block?-119:-104,punch?65:17,block?42:17,f.accent);rect(punch?75:block?24:26,block?-119:-93,19,19,'#f3eee2');if(kick){rect(17,-59,86,22,'#22283e');rect(90,-61,24,25,'#f9f9f9')}rect(-28,-62,55,12,'#f5c258');ctx.restore()}
function hud(){rect(0,0,W,72,'#101829');rect(28,21,W*.38,27,'#3b3449');rect(W-28-W*.38,21,W*.38,27,'#3b3449');rect(31,24,(W*.38-6)*P.hp/100,21,'#39d5e6');const ewidth=(W*.38-6)*E.hp/100;rect(W-31-ewidth,24,ewidth,21,'#f26c6e');ctx.fillStyle='white';ctx.font='bold 16px monospace';ctx.textAlign='left';ctx.fillText('PLAYER  '+P.score,30,17);ctx.textAlign='right';ctx.fillText(E.score+'  CPU',W-30,17);ctx.textAlign='center';ctx.font='bold 34px monospace';ctx.fillText(String(Math.max(0,Math.ceil(timer))).padStart(2,'0'),W/2,45)}
function controls(){for(const b of buttons){ctx.globalAlpha=down(b.id)?.8:.55;ctx.fillStyle='#0b1932';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.globalAlpha=1;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold '+(b.t.length>2?12:22)+'px system-ui';ctx.fillText(b.t,b.x,b.y+6)}}
function draw(t){ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2);ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();fighter(P,t);fighter(E,t);for(const p of particles)rect(p.x,p.y,5,5,p.color);ctx.restore();hud();controls();if(phase!=='fight'){rect(W/2-260,H*.29,520,100,'#101829dd');ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 33px monospace';ctx.fillText(phase==='ready'?'ARCADE FIGHTER':P.hp>E.hp?'YOU WIN!':E.hp>P.hp?'CPU WINS!':'DRAW!',W/2,H*.29+43);ctx.font='17px monospace';ctx.fillText(phase==='ready'?'TAP TO FIGHT':'TAP TO REMATCH',W/2,H*.29+75)}}
function frame(t){const dt=Math.min(50,t-last||16);last=t;for(let i=0;i<Math.min(3,Math.max(1,Math.round(dt/16.667)));i++)step();draw(t);requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>

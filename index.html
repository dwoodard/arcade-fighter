<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101829"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><title>Arcade Fighter</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1422}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#error{position:fixed;inset:0;display:none;place-items:center;background:#111;color:white;font:16px system-ui;padding:30px;text-align:center}</style></head><body><canvas id="game"></canvas><div id="error"></div><script type="module">
try{
const THREE=await import('https://esm.sh/three@0.180.0');
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.autoClear=false;
const scene=new THREE.Scene();scene.background=new THREE.Color('#7294a5');const camera=new THREE.OrthographicCamera(-9,9,5,-5,.1,100);camera.position.set(0,4,23);camera.lookAt(0,4,0);
scene.add(new THREE.HemisphereLight(0xe7f3ff,0x504436,2.3));const light=new THREE.DirectionalLight(0xffe1a8,2.7);light.position.set(-6,12,8);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-17;light.shadow.camera.right=17;light.shadow.camera.top=15;light.shadow.camera.bottom=-15;scene.add(light);
function box(w,h,d,color,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
box(45,.45,12,0x9b8062,0,-.3,0);for(let i=-10;i<=10;i++)box(.035,.015,10,0xc3a78a,i*2, -.065,0);
for(let i=0;i<13;i++){const x=(i-6)*3.2;box(2.2,3+((i*7)%5),1,0x51697a,x,3,-12);box(2.5,.22,1.3,0x364c61,x,5.4+((i*7)%5)/2,-12)}
for(let i=0;i<7;i++){const x=(i-3)*5;box(.22,5,.22,0x473e3a,x,2.3,-8);box(4,.15,.35,0xa04b3b,x,4.6,-8)}
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.76});
function fighter(x,shirt,pants,hair){const root=new THREE.Group();scene.add(root);const visual=new THREE.Group();root.add(visual);function part(w,h,d,c,x,y,z,parent=visual){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
part(.85,1.2,.5,shirt,0,2.25,0);part(.9,.48,.55,pants,0,1.5,0);part(.66,.68,.63,0xe3ad83,0,3.25,0);part(.72,.2,.68,hair,0,3.64,0);
const arms=[],legs=[];for(const s of [-1,1]){const a=new THREE.Group();a.position.set(s*.56,2.75,0);visual.add(a);part(.3,.93,.34,0xe0a67c,0,-.48,0,a);part(.42,.32,.4,shirt,0,-.97,.07,a);arms.push(a);const l=new THREE.Group();l.position.set(s*.26,1.45,0);visual.add(l);part(.39,1.1,.42,pants,0,-.53,0,l);part(.5,.22,.7,0x2c3440,0,-1.09,.17,l);legs.push(l)}root.position.x=x;return {root,visual,arms,legs,x,y:0,vy:0,hp:100,face:x<0?1:-1,state:'idle',timer:0,cool:0,stun:0,blocking:false,attack:null,landed:false,score:0,shirt}}
const p=fighter(-3.3,0xe7e4d6,0xe7e4d6,0x26252c),cpu=fighter(3.3,0xb84e50,0xb84e50,0xc9a06c);let seconds=99,round=1,phase='intro',phaseFrames=95,frameCount=0;
const pressed=new Set(),touch=new Map();addEventListener('keydown',e=>{pressed.add(e.code);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>pressed.delete(e.code));addEventListener('blur',()=>{pressed.clear();touch.clear()});
function buttonLayout(w,h){const s=Math.min(w/800,h/450);const r=Math.max(22,Math.min(43,33*s));return [{id:'left',x:65*s,y:h-63*s,r},{id:'right',x:145*s,y:h-63*s,r},{id:'jump',x:105*s,y:h-130*s,r},{id:'down',x:105*s,y:h-20*s,r},{id:'punch',x:w-135*s,y:h-105*s,r},{id:'kick',x:w-65*s,y:h-75*s,r},{id:'block',x:w-190*s,y:h-43*s,r}]}
function hitButton(x,y){for(const b of buttonLayout(innerWidth,innerHeight)){if(Math.hypot(x-b.x,y-b.y)<b.r*1.4)return b.id}return null}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touch.set(e.pointerId,hitButton(e.clientX,e.clientY));if(phase==='over')restart()});canvas.addEventListener('pointermove',e=>{if(touch.has(e.pointerId))touch.set(e.pointerId,hitButton(e.clientX,e.clientY))});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,e=>touch.delete(e.pointerId));
function down(id){return [...touch.values()].includes(id)||({left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],jump:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],punch:['KeyJ','KeyU'],kick:['KeyK','KeyI'],block:['KeyL','Space']}[id]||[]).some(k=>pressed.has(k))}
function restart(){p.hp=cpu.hp=100;p.x=-3.3;cpu.x=3.3;p.y=cpu.y=0;p.vy=cpu.vy=0;p.stun=cpu.stun=0;p.cool=cpu.cool=0;p.attack=cpu.attack=null;seconds=99;phase='intro';phaseFrames=80}
function logic(f,opp,inp){f.face=f.x<opp.x?1:-1;f.blocking=inp.block&&f.y===0&&f.stun===0;f.cool=Math.max(0,f.cool-1);f.stun=Math.max(0,f.stun-1);f.timer++;if(f.attack){f.attack.frame++;const a=f.attack;if(a.frame>=a.start&&a.frame<a.start+a.active&&!a.hit&&Math.abs(f.x-opp.x)<a.range&&Math.abs(f.y-opp.y)<1.35){a.hit=true;if(opp.blocking){opp.hp=Math.max(0,opp.hp-1);opp.stun=5}else{opp.hp=Math.max(0,opp.hp-a.damage);opp.stun=a.stun;opp.x+=f.face*.32;opp.state='hit'}}if(a.frame>=a.start+a.active+a.recovery)f.attack=null}
if(f.stun===0&&!f.attack){if(inp.punch&&f.cool===0){f.attack={frame:0,start:5,active:4,recovery:11,range:1.9,damage:8,stun:13,hit:false};f.cool=20;f.state='punch'}else if(inp.kick&&f.cool===0){f.attack={frame:0,start:10,active:5,recovery:17,range:2.45,damage:13,stun:19,hit:false};f.cool=32;f.state='kick'}else if(inp.jump&&f.y===0){f.vy=.18;f.state='jump'}else if(f.blocking)f.state='block';else{const dir=(inp.right?1:0)-(inp.left?1:0);f.x+=dir*.058;f.state=dir?'walk':'idle'}}
f.y+=f.vy;f.vy-=.009;if(f.y<0){f.y=0;f.vy=0}f.x=Math.max(-8.7,Math.min(8.7,f.x));f.root.position.set(f.x,f.y,0);f.root.scale.x=f.face;const t=f.timer;const walk=f.state==='walk'?Math.sin(t*.23)*.5:0;f.legs[0].rotation.z=walk;f.legs[1].rotation.z=-walk;f.arms[0].rotation.z=-.28-walk*.4;f.arms[1].rotation.z=.28+walk*.4;f.visual.position.y=Math.sin(t*.08)*.035;if(f.attack){if(f.state==='punch')f.arms[1].rotation.z=-1.3;else {f.legs[1].rotation.z=-1.35;f.arms[0].rotation.z=-.9}}if(f.state==='block'){f.arms[0].rotation.z=-1;f.arms[1].rotation.z=1}if(f.state==='hit')f.visual.rotation.z=-f.face*.12;else f.visual.rotation.z=0}
function update(){frameCount++;if(phase==='intro'){if(--phaseFrames<=0)phase='fight'}if(phase==='fight'){if(frameCount%60===0)seconds--;const dist=cpu.x-p.x;const ai={left:dist>1.7&&Math.random()<.7,right:dist<1.3,block:Math.random()<.025,punch:Math.abs(dist)<2&&Math.random()<.065,kick:Math.abs(dist)<2.6&&Math.random()<.04,jump:false};logic(p,cpu,{left:down('left'),right:down('right'),jump:down('jump'),down:down('down'),punch:down('punch'),kick:down('kick'),block:down('block')});logic(cpu,p,ai);if(Math.abs(p.x-cpu.x)<1.02){const mid=(p.x+cpu.x)/2;p.x=mid-.52;cpu.x=mid+.52}if(p.hp<=0||cpu.hp<=0||seconds<=0){phase='over';phaseFrames=180;if(p.hp>cpu.hp)p.score++;else cpu.score++}}}
const hud=document.createElement('canvas');const ctx=hud.getContext('2d');const tex=new THREE.CanvasTexture(hud);const overlay=new THREE.Scene();const hudCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,2);const plane=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthTest:false}));overlay.add(plane);
function draw(){const w=hud.width=innerWidth*devicePixelRatio,h=hud.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);const W=innerWidth,H=innerHeight;const scale=Math.min(W/800,H/450);const pad=22*scale,bw=Math.min(W*.39,310*scale),bh=17*scale;ctx.fillStyle='#142031';ctx.fillRect(pad,19*scale,bw,bh);ctx.fillRect(W-pad-bw,19*scale,bw,bh);ctx.fillStyle='#f3d354';ctx.fillRect(pad+2*scale,21*scale,(bw-4*scale)*p.hp/100,bh-4*scale);ctx.fillRect(W-pad-bw+2*scale,21*scale,(bw-4*scale)*cpu.hp/100,bh-4*scale);ctx.strokeStyle='#fff3cd';ctx.lineWidth=2*scale;ctx.strokeRect(pad,19*scale,bw,bh);ctx.strokeRect(W-pad-bw,19*scale,bw,bh);ctx.fillStyle='white';ctx.font='bold '+(16*scale)+'px monospace';ctx.textAlign='left';ctx.fillText('PLAYER 1',pad,56*scale);ctx.textAlign='right';ctx.fillText('CPU',W-pad,56*scale);ctx.textAlign='center';ctx.font='900 '+(33*scale)+'px monospace';ctx.fillText(String(seconds).padStart(2,'0'),W/2,39*scale);ctx.font='bold '+(12*scale)+'px monospace';ctx.fillText('ROUND '+round,W/2,56*scale);if(phase!=='fight'){ctx.font='900 '+(38*scale)+'px monospace';ctx.strokeStyle='#162333';ctx.lineWidth=5*scale;const title=phase==='intro'?'ROUND '+round+' — FIGHT!':p.hp>cpu.hp?'YOU WIN!':cpu.hp>p.hp?'CPU WINS':'DRAW';ctx.strokeText(title,W/2,H*.33);ctx.fillStyle='#ffdb76';ctx.fillText(title,W/2,H*.33);if(phase==='over'){ctx.font='bold '+(15*scale)+'px monospace';ctx.fillText('TAP TO PLAY AGAIN',W/2,H*.43)}}if(matchMedia('(pointer:coarse)').matches){for(const b of buttonLayout(W,H)){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=[...touch.values()].includes(b.id)?'rgba(255,220,115,.52)':'rgba(17,27,42,.52)';ctx.fill();ctx.strokeStyle='rgba(245,245,245,.7)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.font='bold '+(12*scale)+'px system-ui';ctx.textAlign='center';ctx.fillText(({left:'◀',right:'▶',jump:'▲',down:'▼',punch:'P',kick:'K',block:'B'})[b.id],b.x,b.y+4*scale)}}tex.needsUpdate=true}
let last=0,acc=0;renderer.setAnimationLoop(ms=>{const dt=Math.min((ms-last)/1000||0,.05);last=ms;acc+=dt;while(acc>=1/60){update();acc-=1/60}camera.position.x=THREE.MathUtils.lerp(camera.position.x,(p.x+cpu.x)*.12,.05);camera.lookAt(camera.position.x,4,0);draw();renderer.clear();renderer.render(scene,camera);renderer.clearDepth();renderer.render(overlay,hudCamera)});
function resize(){const w=innerWidth,h=innerHeight,viewH=10;renderer.setSize(w,h,false);camera.left=-viewH*w/h/2;camera.right=viewH*w/h/2;camera.top=viewH/2;camera.bottom=-viewH/2;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();

}catch(e){const el=document.querySelector('#error');el.style.display='grid';el.textContent='Unable to start 3D game: '+e.message}
